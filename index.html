<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Korean Verb Master</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e6e8ef;--soft:#f1efff;--good:#15803d;--bad:#dc2626}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
body.dark{--bg:#10131b;--card:#191e29;--text:#f3f4f6;--muted:#a8afbd;--line:#303746;--soft:#27233d}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:25px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 3px 15px #0002}
header h1{margin:0;font-size:29px}header p{margin:7px 0 0;opacity:.92}.container{max-width:1150px;margin:auto;padding:15px}
.panel,.card,.stat,.quiz{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #0000000b}.panel{padding:15px;margin-bottom:15px}
.controls{display:grid;grid-template-columns:2fr 1fr;gap:10px}.controls input,.controls select{width:100%;padding:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;font-size:16px;outline:none}.controls input:focus{border-color:var(--p)}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:10px;padding:10px 14px;background:var(--p);color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#e9eaf0;color:#252936}body.dark button.secondary{background:#2a3040;color:#fff}button.good{background:var(--good)}button.danger{background:var(--bad)}button:active{transform:scale(.98)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{text-align:center;padding:13px}.stat b{font-size:22px}.stat small{color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar span{color:var(--muted);font-size:14px}.verb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}
.card{padding:16px;position:relative;transition:.18s}.card:hover{transform:translateY(-2px)}.top{display:flex;justify-content:space-between;gap:8px}.ko{font-size:28px;font-weight:800;color:var(--p)}.fav{background:transparent;color:#aaa;font-size:23px;padding:0}.fav.active{color:#f59e0b}.en{font-size:18px;font-weight:700;margin-top:2px}.roman{color:var(--muted);font-size:13px;margin-top:3px}.tag{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:20px;background:var(--soft);font-size:12px}.example{margin-top:12px;background:var(--soft);padding:10px;border-radius:10px}.example .k{font-weight:700}.example .e{margin-top:4px;color:var(--muted)}.forms{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.form{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.form b{color:var(--p)}
.empty{text-align:center;padding:30px;color:var(--muted);grid-column:1/-1}.hidden{display:none!important}
.quiz{padding:18px;margin-bottom:15px}.quiz h2{margin-top:0}.qword{font-size:38px;font-weight:800;color:var(--p);text-align:center;margin:15px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.options button{background:var(--card);color:var(--text);border:1px solid var(--line);text-align:left}.options button.correct{background:#dcfce7;color:#166534;border-color:#86efac}.options button.wrong{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.result{text-align:center;font-weight:700;margin-top:12px}
footer{text-align:center;color:var(--muted);padding:28px 10px}.install-note{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:650px){header h1{font-size:24px}.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}.verb-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.ko{font-size:26px}}
</style>
</head>
<body>
<header><h1>🇰🇷 Korean Verb Master</h1><p>Learn • Search • Listen • Practice • Remember</p></header>
<main class="container">
<section class="panel">
 <div class="controls"><input id="search" placeholder="🔎 Search Korean, English or romanization..." autocomplete="off"><select id="category"><option value="all">All categories</option><option value="daily">Daily Life</option><option value="movement">Movement</option><option value="communication">Communication</option><option value="thinking">Thinking</option><option value="work">Work & Study</option><option value="emotion">Emotion</option><option value="action">Common Actions</option><option value="travel">Travel</option></select></div>
 <div class="buttons"><button id="allBtn">📚 All</button><button id="randomBtn">🎲 Random</button><button id="favBtn" class="secondary">⭐ Favorites</button><button id="quizBtn" class="good">🧠 Quiz</button><button id="themeBtn" class="secondary">🌙 Dark</button></div>
 <div class="install-note">Tip: In Acode, save this as <b>index.html</b> and use Preview.</div>
</section>
<section class="stats"><div class="stat"><b id="total">0</b><br><small>Shown</small></div><div class="stat"><b id="allCount">0</b><br><small>Total verbs</small></div><div class="stat"><b id="favCount">0</b><br><small>Favorites</small></div><div class="stat"><b id="quizScore">0</b><br><small>Quiz score</small></div></section>
<section id="quiz" class="quiz hidden"><h2>🧠 Korean Verb Quiz</h2><div class="qword" id="qword">가다</div><div class="options" id="options"></div><div class="result" id="qresult"></div><div class="buttons"><button id="nextQ">Next Question ➜</button><button id="closeQuiz" class="secondary">Close</button></div></section>
<div class="toolbar"><span id="status">Showing all verbs</span><button id="topBtn" class="secondary">↑ Top</button></div>
<section id="grid" class="verb-grid"></section>
</main>
<footer>Korean Verb Master 🇰🇷<br><small>Standalone HTML • No internet required</small></footer>
<script>
const verbs=[
['가다','to go','gada','daily','학교에 가요.','I go to school.','가요','갔어요','가고 있어요'],['오다','to come','oda','movement','친구가 와요.','My friend is coming.','와요','왔어요','오고 있어요'],['먹다','to eat','meokda','daily','밥을 먹어요.','I eat rice.','먹어요','먹었어요','먹고 있어요'],['마시다','to drink','masida','daily','물을 마셔요.','I drink water.','마셔요','마셨어요','마시고 있어요'],['자다','to sleep','jada','daily','일찍 자요.','I sleep early.','자요','잤어요','자고 있어요'],['일어나다','to get up','ireonada','daily','7시에 일어나요.','I get up at 7.','일어나요','일어났어요','일어나고 있어요'],['씻다','to wash','ssitda','daily','손을 씻어요.','I wash my hands.','씻어요','씻었어요','씻고 있어요'],['입다','to wear','ipda','daily','옷을 입어요.','I wear clothes.','입어요','입었어요','입고 있어요'],['벗다','to take off','beotda','daily','신발을 벗어요.','I take off my shoes.','벗어요','벗었어요','벗고 있어요'],['사다','to buy','sada','daily','책을 사요.','I buy a book.','사요','샀어요','사고 있어요'],['팔다','to sell','palda','daily','물건을 팔아요.','I sell things.','팔아요','팔았어요','팔고 있어요'],['걷다','to walk','geotda','movement','공원에서 걸어요.','I walk in the park.','걸어요','걸었어요','걷고 있어요'],['뛰다','to run','ttwida','movement','빨리 뛰어요.','I run quickly.','뛰어요','뛰었어요','뛰고 있어요'],['달리다','to run/race','dallida','movement','매일 달려요.','I run every day.','달려요','달렸어요','달리고 있어요'],['들어가다','to enter/go in','deureogada','movement','방에 들어가요.','I enter the room.','들어가요','들어갔어요','들어가고 있어요'],['나가다','to go out','nagada','movement','밖에 나가요.','I go outside.','나가요','나갔어요','나가고 있어요'],['올라가다','to go up','ollagada','movement','계단으로 올라가요.','I go upstairs.','올라가요','올라갔어요','올라가고 있어요'],['내려가다','to go down','naeryeogada','movement','아래층으로 내려가요.','I go downstairs.','내려가요','내려갔어요','내려가고 있어요'],['돌아가다','to return/go back','doragada','movement','집에 돌아가요.','I return home.','돌아가요','돌아갔어요','돌아가고 있어요'],['말하다','to speak/say','malhada','communication','한국어로 말해요.','I speak Korean.','말해요','말했어요','말하고 있어요'],['듣다','to listen/hear','deutda','communication','음악을 들어요.','I listen to music.','들어요','들었어요','듣고 있어요'],['읽다','to read','ikda','communication','책을 읽어요.','I read a book.','읽어요','읽었어요','읽고 있어요'],['쓰다','to write/use','sseuda','communication','편지를 써요.','I write a letter.','써요','썼어요','쓰고 있어요'],['묻다','to ask','mutda','communication','선생님께 물어요.','I ask the teacher.','물어요','물었어요','묻고 있어요'],['대답하다','to answer','daedaphada','communication','질문에 대답해요.','I answer the question.','대답해요','대답했어요','대답하고 있어요'],['전화하다','to call','jeonhwahada','communication','친구에게 전화해요.','I call my friend.','전화해요','전화했어요','전화하고 있어요'],['만나다','to meet','mannada','communication','친구를 만나요.','I meet my friend.','만나요','만났어요','만나고 있어요'],['생각하다','to think','saenggakhada','thinking','그것을 생각해요.','I think about it.','생각해요','생각했어요','생각하고 있어요'],['알다','to know','alda','thinking','그 사실을 알아요.','I know that fact.','알아요','알았어요','알고 있어요'],['모르다','to not know','moreuda','thinking','잘 몰라요.','I do not know.','몰라요','몰랐어요','모르고 있어요'],['이해하다','to understand','ihaehada','thinking','한국어를 이해해요.','I understand Korean.','이해해요','이해했어요','이해하고 있어요'],['배우다','to learn','baeuda','work','한국어를 배워요.','I learn Korean.','배워요','배웠어요','배우고 있어요'],['공부하다','to study','gongbuhada','work','한국어를 공부해요.','I study Korean.','공부해요','공부했어요','공부하고 있어요'],['일하다','to work','ilhada','work','회사에서 일해요.','I work at a company.','일해요','일했어요','일하고 있어요'],['만들다','to make','mandeulda','work','음식을 만들어요.','I make food.','만들어요','만들었어요','만들고 있어요'],['사용하다','to use','sayonghada','work','컴퓨터를 사용해요.','I use a computer.','사용해요','사용했어요','사용하고 있어요'],['시작하다','to start','sijakhada','work','수업을 시작해요.','I start the class.','시작해요','시작했어요','시작하고 있어요'],['끝나다','to finish/end','kkeunnada','work','수업이 끝나요.','The class ends.','끝나요','끝났어요','끝나고 있어요'],['좋아하다','to like','joahada','emotion','한국 음식을 좋아해요.','I like Korean food.','좋아해요','좋아했어요','좋아하고 있어요'],['사랑하다','to love','saranghada','emotion','가족을 사랑해요.','I love my family.','사랑해요','사랑했어요','사랑하고 있어요'],['싫어하다','to dislike','sireohada','emotion','매운 음식을 싫어해요.','I dislike spicy food.','싫어해요','싫어했어요','싫어하고 있어요'],['웃다','to laugh/smile','utda','emotion','친구가 웃어요.','My friend laughs.','웃어요','웃었어요','웃고 있어요'],['울다','to cry','ulda','emotion','아이가 울어요.','The child is crying.','울어요','울었어요','울고 있어요'],['열다','to open','yeolda','action','문을 열어요.','I open the door.','열어요','열었어요','열고 있어요'],['닫다','to close','datda','action','문을 닫아요.','I close the door.','닫아요','닫았어요','닫고 있어요'],['주다','to give','juda','action','친구에게 책을 줘요.','I give a book to my friend.','줘요','줬어요','주고 있어요'],['받다','to receive','batda','action','선물을 받아요.','I receive a gift.','받아요','받았어요','받고 있어요'],['찾다','to find/look for','chatda','action','열쇠를 찾아요.','I look for the key.','찾아요','찾았어요','찾고 있어요'],['기다리다','to wait','gidarida','action','친구를 기다려요.','I wait for my friend.','기다려요','기다렸어요','기다리고 있어요'],['도와주다','to help','dowajuda','action','친구를 도와줘요.','I help my friend.','도와줘요','도와줬어요','도와주고 있어요'],['배달하다','to deliver','baedalhada','work','음식을 배달해요.','I deliver food.','배달해요','배달했어요','배달하고 있어요'],['타다','to ride/take','tada','travel','버스를 타요.','I take the bus.','타요','탔어요','타고 있어요'],['내리다','to get off','naerida','travel','버스에서 내려요.','I get off the bus.','내려요','내렸어요','내리고 있어요'],['여행하다','to travel','yeohaenghada','travel','한국을 여행해요.','I travel in Korea.','여행해요','여행했어요','여행하고 있어요'],['예약하다','to reserve/book','yeyakhada','travel','호텔을 예약해요.','I book a hotel.','예약해요','예약했어요','예약하고 있어요'],['출발하다','to depart','chulbalhada','travel','8시에 출발해요.','I depart at 8.','출발해요','출발했어요','출발하고 있어요'],['도착하다','to arrive','dochakhada','travel','서울에 도착해요.','I arrive in Seoul.','도착해요','도착했어요','도착하고 있어요'],['살다','to live','salda','daily','네팔에 살아요.','I live in Nepal.','살아요','살았어요','살고 있어요'],['요리하다','to cook','yorihada','daily','저녁을 요리해요.','I cook dinner.','요리해요','요리했어요','요리하고 있어요'],['청소하다','to clean','cheongsohada','daily','방을 청소해요.','I clean the room.','청소해요','청소했어요','청소하고 있어요'],['운동하다','to exercise','undonghada','daily','매일 운동해요.','I exercise every day.','운동해요','운동했어요','운동하고 있어요'],['쉬다','to rest','swida','daily','집에서 쉬어요.','I rest at home.','쉬어요','쉬었어요','쉬고 있어요'],['찍다','to take a photo','jjikda','action','사진을 찍어요.','I take a photo.','찍어요','찍었어요','찍고 있어요'],['보내다','to send/spend','bonaeda','communication','메시지를 보내요.','I send a message.','보내요','보냈어요','보내고 있어요'],['기억하다','to remember','gieokhada','thinking','이름을 기억해요.','I remember the name.','기억해요','기억했어요','기억하고 있어요'],['잊다','to forget','itda','thinking','약속을 잊어요.','I forget the appointment.','잊어요','잊었어요','잊고 있어요'],['결정하다','to decide','gyeoljeonghada','thinking','결정해요.','I decide.','결정해요','결정했어요','결정하고 있어요']
].map(x=>({ko:x[0],en:x[1],roman:x[2],cat:x[3],exampleKo:x[4],exampleEn:x[5],present:x[6],past:x[7],progressive:x[8]}));

let favorites=JSON.parse(localStorage.getItem('krVerbFav')||'[]');let showingFav=false;let currentList=verbs;let quizScore=Number(localStorage.getItem('krQuizScore')||0);let quizVerb=null;
const $=id=>document.getElementById(id);
function saveFav(){localStorage.setItem('krVerbFav',JSON.stringify(favorites));$('favCount').textContent=favorites.length}
function render(list){currentList=list;$('total').textContent=list.length;$('allCount').textContent=verbs.length;saveFav();$('quizScore').textContent=quizScore;$('status').textContent=showingFav?'⭐ Showing favorites':`Showing ${list.length} verb${list.length!==1?'s':''}`;const grid=$('grid');grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">😢 No verbs found.<br>Try another search or category.</div>';return}list.forEach(v=>{const i=verbs.indexOf(v);const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="top"><div><div class="ko">${v.ko}</div><div class="en">${v.en}</div><div class="roman">${v.roman}</div></div><button class="fav ${favorites.includes(i)?'active':''}" data-fav="${i}" title="Favorite">★</button></div><span class="tag">${v.cat}</span><div class="example"><div class="k">${v.exampleKo}</div><div class="e">${v.exampleEn}</div></div><div class="forms"><div class="form"><span>Present</span><b>${v.present}</b></div><div class="form"><span>Past</span><b>${v.past}</b></div><div class="form"><span>Progressive</span><b>${v.progressive}</b></div></div><div class="buttons"><button class="secondary speak" data-speak="${i}">🔊 Listen</button></div>`;grid.appendChild(c)})}
function filter(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value;let list=verbs.filter(v=>(cat==='all'||v.cat===cat)&&(!q||[v.ko,v.en,v.roman,v.exampleKo,v.exampleEn].join(' ').toLowerCase().includes(q)));if(showingFav)list=list.filter(v=>favorites.includes(verbs.indexOf(v)));render(list)}
$('search').addEventListener('input',filter);$('category').addEventListener('change',filter);$('allBtn').onclick=()=>{showingFav=false;$('search').value='';$('category').value='all';filter()};$('favBtn').onclick=()=>{showingFav=!showingFav;filter()};$('randomBtn').onclick=()=>{showingFav=false;const v=verbs[Math.floor(Math.random()*verbs.length)];render([v]);$('grid').scrollIntoView({behavior:'smooth'})};$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');$('themeBtn').textContent=document.body.classList.contains('dark')?'☀️ Light':'🌙 Dark';localStorage.setItem('krDark',document.body.classList.contains('dark'))};if(localStorage.getItem('krDark')==='true'){$('themeBtn').click()}
$('grid').addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){const i=Number(f.dataset.fav);favorites=favorites.includes(i)?favorites.filter(x=>x!==i):[...favorites,i];saveFav();filter();return}const s=e.target.closest('[data-speak]');if(s){const v=verbs[Number(s.dataset.speak)];if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(v.ko);u.lang='ko-KR';u.rate=.75;speechSynthesis.cancel();speechSynthesis.speak(u)}else alert('Speech is not supported on this browser.')}});
$('topBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});
function newQuestion(){if(verbs.length<4)return;quizVerb=verbs[Math.floor(Math.random()*verbs.length)];$('qword').textContent=quizVerb.ko;$('qresult').textContent='';let pool=verbs.filter(v=>v!==quizVerb).sort(()=>Math.random()-.5).slice(0,3).concat([quizVerb]).sort(()=>Math.random()-.5);$('options').innerHTML='';pool.forEach(v=>{const b=document.createElement('button');b.textContent=v.en;b.onclick=()=>{if(b.dataset.done)return;document.querySelectorAll('#options button').forEach(x=>x.dataset.done='1');if(v===quizVerb){b.classList.add('correct');quizScore++;$('qresult').textContent='✅ Correct!';}else{b.classList.add('wrong');$('qresult').textContent=`❌ Correct answer: ${quizVerb.en}`;[...document.querySelectorAll('#options button')].find(x=>x.textContent===quizVerb.en)?.classList.add('correct')}localStorage.setItem('krQuizScore',quizScore);$('quizScore').textContent=quizScore}});}
$('quizBtn').onclick=()=>{$('quiz').classList.remove('hidden');newQuestion();$('quiz').scrollIntoView({behavior:'smooth'})};$('nextQ').onclick=newQuestion;$('closeQuiz').onclick=()=>$('quiz').classList.add('hidden');
render(verbs);
</script>
</body></html>
